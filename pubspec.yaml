name: passive_liveness
description: "Ultra-lightweight passive face liveness detection using native TFLite (Google Play Services on Android, TensorFlowLiteSwift on iOS) for Flutter."
version: 0.1.0
homepage: https://github.com/andikatp/passive_liveness
repository: https://github.com/andikatp/passive_liveness
issue_tracker: https://github.com/andikatp/passive_liveness/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.andikatp.passiveLiveness
        pluginClass: PassiveLivenessPlugin
      ios:
        pluginClass: PassiveLivenessPlugin
        swiftPackage: true
  assets:
    - assets/best_model.tflite
